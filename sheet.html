<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Character Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07001a;
      --bg2: #0e0030;
      --bg3: #160048;
      --card: #1a0050;
      --card-border: #3a1080;
      --text: #e8d8ff;
      --text-dim: #8866bb;
      --accent: #c060ff;
      --accent2: #7020e0;
      --gold: #ffd060;
      --gold2: #ffaa00;
      --red: #ff4060;
      --green: #40ff90;
      --font-head: 'Orbitron', monospace;
      --font-body: 'Exo 2', sans-serif;
      --radius: 10px;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 45%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 55% 8%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 25%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 75%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(2px 2px at 50% 50%, rgba(160,60,255,0.25) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    body > * { position: relative; z-index: 1; }

    .sheet-wrap {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 14px 48px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Top bar ── */
    .sheet-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }

    .sheet-title {
      font-family: var(--font-head);
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--accent);
    }

    .deceased-badge {
      font-family: var(--font-head);
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--red);
      border: 1px solid var(--red);
      border-radius: 4px;
      padding: 3px 7px;
      opacity: 0.85;
    }

    /* ── Card base ── */
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px 14px;
    }

    .card-label {
      font-family: var(--font-head);
      font-size: 8px;
      letter-spacing: 4px;
      color: var(--accent);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    /* ── Editable field ── */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .field-label {
      font-family: var(--font-head);
      font-size: 8px;
      letter-spacing: 3px;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .field-input {
      background: var(--bg2);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      padding: 9px 11px;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }

    .field-input:focus { border-color: var(--accent); }

    .field-input.small {
      font-size: 13px;
      padding: 7px 10px;
    }

    textarea.field-input {
      resize: none;
      line-height: 1.5;
    }

    /* ── Identity row ── */
    .identity-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .age-field { width: 70px; }

    /* ── Stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .stat-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .stat-label {
      font-family: var(--font-head);
      font-size: 8px;
      letter-spacing: 2px;
      color: var(--text-dim);
    }

    .stat-input {
      background: var(--bg2);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--gold);
      font-family: var(--font-head);
      font-size: 18px;
      font-weight: 700;
      padding: 8px 4px;
      outline: none;
      width: 100%;
      text-align: center;
      transition: border-color 0.2s;
    }

    .stat-input:focus { border-color: var(--accent); }

    /* ── Weapon area (expanded) ── */
    .weapon-section { display: flex; flex-direction: column; gap: 10px; }

    .weapon-slot {
      background: var(--bg2);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .weapon-slot-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .weapon-slot-num {
      font-family: var(--font-head);
      font-size: 8px;
      letter-spacing: 3px;
      color: var(--accent);
    }

    .weapon-remove-btn {
      background: none;
      border: 1px solid var(--card-border);
      border-radius: 4px;
      color: var(--text-dim);
      font-size: 12px;
      width: 22px;
      height: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .weapon-remove-btn:hover { border-color: var(--red); color: var(--red); }

    .weapon-name-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
    }

    .weapon-bonus-input {
      width: 64px;
      text-align: center;
    }

    .weapon-details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .weapon-props-row { grid-column: 1 / -1; }

    .add-weapon-btn {
      background: none;
      border: 1px dashed var(--card-border);
      border-radius: 8px;
      color: var(--text-dim);
      font-family: var(--font-head);
      font-size: 10px;
      letter-spacing: 3px;
      padding: 11px;
      cursor: pointer;
      width: 100%;
      text-align: center;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .add-weapon-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Feats / Flaws / Injury ── */
    .feats-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .feat-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .feat-remove-btn {
      background: none;
      border: 1px solid var(--card-border);
      border-radius: 4px;
      color: var(--text-dim);
      font-size: 12px;
      width: 28px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .feat-remove-btn:hover { border-color: var(--red); color: var(--red); }

    .add-feat-btn {
      background: none;
      border: 1px dashed var(--card-border);
      border-radius: 6px;
      color: var(--text-dim);
      font-family: var(--font-head);
      font-size: 9px;
      letter-spacing: 3px;
      padding: 8px;
      cursor: pointer;
      width: 100%;
      text-align: center;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .add-feat-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Tragedy ── */
    .tragedy-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tragedy-label {
      font-family: var(--font-head);
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .tally-area {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      flex: 1;
    }

    .tally-mark {
      width: 20px;
      height: 28px;
      border-radius: 3px;
      border: 1px solid var(--card-border);
      background: var(--red);
      opacity: 0.7;
      cursor: pointer;
      transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .tally-mark.empty {
      background: transparent;
      border-style: dashed;
    }

    .tally-mark:hover { opacity: 1; }

    .tally-add-btn {
      width: 20px;
      height: 28px;
      border-radius: 3px;
      border: 1px dashed var(--card-border);
      background: none;
      color: var(--text-dim);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .tally-add-btn:hover { border-color: var(--red); color: var(--red); }

    [hidden] { display: none !important; }
  </style>
</head>
<body>

<div class="sheet-wrap">

  <!-- Top bar -->
  <div class="sheet-topbar">
    <span class="sheet-title">CHARACTER SHEET</span>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
      <span class="deceased-badge" id="deceased-badge" hidden>DECEASED</span>
      <input type="checkbox" id="deceased-toggle" style="display:none">
      <button id="deceased-btn" onclick="toggleDeceased()" style="background:none;border:1px solid var(--card-border);border-radius:4px;color:var(--text-dim);font-family:var(--font-head);font-size:8px;letter-spacing:2px;padding:4px 8px;cursor:pointer;">✕ MARK DECEASED</button>
    </label>
  </div>

  <!-- Identity -->
  <div class="card">
    <div class="card-label">Identity</div>
    <div class="identity-grid">
      <div class="field-group">
        <span class="field-label">Name</span>
        <input type="text" class="field-input" placeholder="Character name" autocomplete="off">
      </div>
      <div class="field-group age-field">
        <span class="field-label">Age</span>
        <input type="text" class="field-input" placeholder="—" autocomplete="off" style="width:70px;text-align:center;">
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="card">
    <div class="card-label">Attributes</div>
    <div class="stats-grid">
      <div class="stat-cell">
        <span class="stat-label">AGI</span>
        <input type="text" class="stat-input" placeholder="0" autocomplete="off">
      </div>
      <div class="stat-cell">
        <span class="stat-label">PRE</span>
        <input type="text" class="stat-input" placeholder="0" autocomplete="off">
      </div>
      <div class="stat-cell">
        <span class="stat-label">STR</span>
        <input type="text" class="stat-input" placeholder="0" autocomplete="off">
      </div>
      <div class="stat-cell">
        <span class="stat-label">CARRY</span>
        <input type="text" class="stat-input" placeholder="0" autocomplete="off">
      </div>
      <div class="stat-cell">
        <span class="stat-label">TOU</span>
        <input type="text" class="stat-input" placeholder="0" autocomplete="off">
      </div>
    </div>
  </div>

  <!-- Weapons (expanded) -->
  <div class="card">
    <div class="card-label">Weapons</div>
    <div class="weapon-section" id="weapon-list"></div>
    <button class="add-weapon-btn" onclick="addWeapon()">+ ADD WEAPON</button>
  </div>

  <!-- Feats / Flaws / Injury -->
  <div class="card">
    <div class="card-label">Feats, Flaws &amp; Injury</div>
    <div class="feats-list" id="feats-list"></div>
    <button class="add-feat-btn" onclick="addFeat()" style="margin-top:8px;">+ ADD ENTRY</button>
  </div>

  <!-- Tragedy -->
  <div class="card">
    <div class="card-label">Tragedy</div>
    <div class="tragedy-row">
      <span class="tragedy-label">MARKS</span>
      <div class="tally-area" id="tally-area"></div>
      <button class="tally-add-btn" onclick="addTally()" title="Add mark">+</button>
    </div>
  </div>

</div>

<script>
  /* ── Deceased toggle ── */
  function toggleDeceased() {
    const badge = document.getElementById('deceased-badge');
    const btn   = document.getElementById('deceased-btn');
    const on    = badge.hidden;
    badge.hidden = !on;
    btn.textContent = on ? '✓ ALIVE' : '✕ MARK DECEASED';
    btn.style.color  = on ? 'var(--red)'      : 'var(--text-dim)';
    btn.style.borderColor = on ? 'var(--red)' : 'var(--card-border)';
  }

  /* ── Weapons ── */
  let weaponCount = 0;

  function addWeapon(name='', bonus='', dmg='', range='', wt='', props='') {
    weaponCount++;
    const id  = weaponCount;
    const list = document.getElementById('weapon-list');
    const slot = document.createElement('div');
    slot.className = 'weapon-slot';
    slot.id = 'weapon-' + id;
    slot.innerHTML = `
      <div class="weapon-slot-header">
        <span class="weapon-slot-num">WEAPON ${id}</span>
        <button class="weapon-remove-btn" onclick="removeWeapon(${id})" title="Remove">✕</button>
      </div>
      <div class="weapon-name-row">
        <div class="field-group">
          <span class="field-label">Name</span>
          <input type="text" class="field-input small" placeholder="e.g. Longsword" value="${esc(name)}" autocomplete="off">
        </div>
        <div class="field-group">
          <span class="field-label">Bonus</span>
          <input type="text" class="field-input small weapon-bonus-input" placeholder="+0" value="${esc(bonus)}" autocomplete="off">
        </div>
      </div>
      <div class="weapon-details-grid">
        <div class="field-group">
          <span class="field-label">Damage</span>
          <input type="text" class="field-input small" placeholder="e.g. d8+STR" value="${esc(dmg)}" autocomplete="off">
        </div>
        <div class="field-group">
          <span class="field-label">Range</span>
          <input type="text" class="field-input small" placeholder="e.g. Near" value="${esc(range)}" autocomplete="off">
        </div>
        <div class="field-group">
          <span class="field-label">Weight</span>
          <input type="text" class="field-input small" placeholder="e.g. Normal" value="${esc(wt)}" autocomplete="off">
        </div>
        <div class="field-group weapon-props-row">
          <span class="field-label">Properties / Notes</span>
          <textarea class="field-input small" rows="2" placeholder="Special rules, enchantments, damage bonuses…">${esc(props)}</textarea>
        </div>
      </div>
    `;
    list.appendChild(slot);
  }

  function removeWeapon(id) {
    const el = document.getElementById('weapon-' + id);
    if (el) el.remove();
  }

  /* ── Feats ── */
  let featCount = 0;

  function addFeat(val='') {
    featCount++;
    const id   = featCount;
    const list = document.getElementById('feats-list');
    const row  = document.createElement('div');
    row.className = 'feat-row';
    row.id = 'feat-' + id;
    row.innerHTML = `
      <input type="text" class="field-input small" placeholder="e.g. Barkskin (+1 ARM, −1 AGI)" value="${esc(val)}" autocomplete="off">
      <button class="feat-remove-btn" onclick="removeFeat(${id})" title="Remove">✕</button>
    `;
    list.appendChild(row);
  }

  function removeFeat(id) {
    const el = document.getElementById('feat-' + id);
    if (el) el.remove();
  }

  /* ── Tragedy tallies ── */
  let tallyCount = 0;

  function addTally() {
    tallyCount++;
    const id   = tallyCount;
    const area = document.getElementById('tally-area');
    const mark = document.createElement('div');
    mark.className = 'tally-mark';
    mark.id = 'tally-' + id;
    mark.title = 'Click to remove';
    mark.onclick = () => removeTally(id);
    area.appendChild(mark);
  }

  function removeTally(id) {
    const el = document.getElementById('tally-' + id);
    if (el) el.remove();
    tallyCount--;
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* ── Seed one weapon slot and two feat rows on load ── */
  addWeapon();
  addFeat();
  addFeat();
</script>

</body>
</html>
